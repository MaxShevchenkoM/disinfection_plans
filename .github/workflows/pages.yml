name: Deploy prod + preprod
on:
  push:
    branches: [main, preprod]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Prod (гілка main) -> /
        uses: actions/checkout@v4
        with: { ref: main, path: prod }
      - name: Preprod (гілка preprod) -> /preprod/
        uses: actions/checkout@v4
        with: { ref: preprod, path: pre }
        continue-on-error: true
      - name: Build site
        run: |
          mkdir -p site/preprod
          cp prod/index.html site/
          echo 'window.PLAN_ENV={name:"prod",table:"plan_prod"};' > site/env.js
          if [ -f pre/index.html ]; then cp pre/index.html site/preprod/; else cp prod/index.html site/preprod/; fi
          echo 'window.PLAN_ENV={name:"preprod",table:"plan_preprod"};' > site/preprod/env.js
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deployment
        uses: actions/deploy-pages@v4
