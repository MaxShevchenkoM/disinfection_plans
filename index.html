<style>
:root{color-scheme:light dark;--bg:light-dark(#f4f5f2,#14181a);--paper:light-dark(#ffffff,#1c2124);--ink:light-dark(#1d2326,#e6eaea);--mute:light-dark(#68716f,#9aa4a3);--grid:light-dark(#e7ebe8,#262d30);--wall:light-dark(#2b3336,#c9d1d1);--room:light-dark(#fbfcfa,#20262a);--eq:light-dark(#eceeea,#2c3337);--teal:light-dark(#d5efe6,#16413a);--tealk:light-dark(#0f6e56,#7fd8bb);--blue:light-dark(#d4e6f8,#183552);--bluek:light-dark(#185fa5,#9cc6f0);--amb:light-dark(#f7e2bd,#4a3412);--ambk:light-dark(#854f0b,#f0c27a);--sel:#e3460b;--line:light-dark(#cfd5d2,#3a4246)}

.tab{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:0 4px 0 10px;min-height:40px}

button,select,input,textarea{font:inherit;color:var(--ink)}

.sep{width:1px;background:var(--grid);margin:0 4px}

.wrap{overflow:auto}

.tn{display:flex;align-items:center;gap:6px;min-height:30px;padding:0 6px 0 calc(6px + var(--d,0)*18px);cursor:default;user-select:none;-webkit-user-select:none;border-left:3px solid transparent}

#save{font-weight:500}#save.err{color:#c0392b}
