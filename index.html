<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>План клініки</title>
<script src="env.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="top">
<div class="titlebar"><span class="logo"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1.5" y="1.5" width="13" height="13" rx="2"/><path d="M1.5 6h13M6 6v8.5"/></svg></span><b class="appn">План клініки</b><button type="button" class="tb ico edit" id="undo" title="Ctrl+Z"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3L2 6l3 3"/><path d="M2 6h7a4 4 0 010 8H6"/></svg></button><span id="envb"></span><span class="sp"></span><span id="save"></span><span class="clinw"><button type="button" id="clinb" class="clin" title="Клініка · подвійний клік — перейменувати"><span id="clinn"></span> ▾</button><div id="clinm" class="cm clinm" hidden role="listbox"></div></span><span id="who" class="who">Перегляд</span><button type="button" id="login" class="tb">Увійти</button><button type="button" id="logout" class="tb" hidden>Вийти</button><button type="button" class="tb ico mobx" id="mobx" title="Вийти з мобільного вигляду"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1.5" y="2.5" width="13" height="9" rx="1"/><path d="M5.5 14h5M8 11.5V14"/></svg></button><button type="button" class="tb ico" id="help" title="Шар угорі — що редагується; решта видно блідо. Shift+клік — додати до виділення, Shift+рамка — виділити кілька. Ctrl+A — усе на шарі, Ctrl+G — згрупувати, Ctrl+Z — назад, Esc — зняти виділення. Стіни й стрілки тягніть за кінці."><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="6.5"/><path d="M6.3 6.2a1.8 1.8 0 113 1.4c-.6.4-1.3.8-1.3 1.6M8 11.5v.2"/></svg></button></div>
<nav class="rtabs" id="rtabs" role="tablist"></nav>
<div class="ribbon" id="ribbon">
<div class="rbg" data-rt="rooms zones flows"><div class="rbc" id="tabs"></div><div class="rbl">Шари</div></div>
<div class="rbg edit" data-rt="rooms zones flows"><div class="rbc"><span id="presets" style="display:contents"></span></div><div class="rbl">Додати</div></div>
<div class="rbg edit" data-rt="none"><div class="rbc"><button type="button" class="rb" id="sla" title="Ctrl+A"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="12" height="12" rx="1.5" stroke-dasharray="2 2"/></svg><span>На шарі</span></button><button type="button" class="rb" id="saa" title="Ctrl+Shift+A"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1.5" y="1.5" width="9" height="9" rx="1" stroke-dasharray="2 2"/><rect x="5.5" y="5.5" width="9" height="9" rx="1" stroke-dasharray="2 2"/></svg><span>Усі шари</span></button></div><div class="rbl">Виділити</div></div>
<div class="rbg edit" data-rt="none"><div class="rbc"><button type="button" class="rb" id="grp" title="Ctrl+G" disabled><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/><rect x="1" y="1" width="14" height="14" rx="2" stroke-dasharray="2 2"/></svg><span>Згрупувати</span></button><button type="button" class="rb" id="ungrp" title="Ctrl+Shift+G" disabled><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg><span>Розгрупувати</span></button><button type="button" class="rb" id="mdup" disabled><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="5" width="9" height="9" rx="1.5"/><path d="M11 5V3.5A1.5 1.5 0 009.5 2h-6A1.5 1.5 0 002 3.5v6A1.5 1.5 0 003.5 11H5"/></svg><span>Копія</span></button><button type="button" class="rb" id="mdel" disabled title="Delete"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h10M6 4V2.5h4V4M4.5 4l.7 9.5h5.6L11.5 4"/></svg><span>Видалити</span></button></div><div class="rbl">Упорядкувати</div></div>
<div class="rbg" data-rt="zones flows"><div class="rbc"><button type="button" class="rb" id="anl" aria-pressed="false"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M8 1.5l6.5 12h-13z"/><path d="M8 6v3.5M8 11.5v.3"/></svg><span>Аналіз конфліктів</span></button><button type="button" class="rb" id="hzt" aria-pressed="true" title="Показувати радіуси бризок, аерозолю, шерсті, брудного біля чистого"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="2"/><circle cx="8" cy="8" r="5.5" stroke-dasharray="2.5 2"/></svg><span>Радіуси ризиків</span></button></div><div class="rbl">Аналіз</div></div>
<div class="rbg edit" data-rt="none"><div class="rbc"><span class="mat" id="mat"><button data-m="metal" disabled>Метал</button><button data-m="wood" disabled>Дерево</button><button data-m="plastic" disabled>Пластик</button><button data-m="glass" disabled>Скло</button><button data-m="" disabled title="Прибрати матеріал">—</button></span></div><div class="rbl">Матеріал</div></div>
<div class="rbg" data-rt="view"><div class="rbc"><button type="button" class="rb" id="zout"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M14 14l-3.8-3.8M5 7h4"/></svg><span>Зменшити</span></button><span class="zv" id="zval">100%</span><button type="button" class="rb" id="zin"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M14 14l-3.8-3.8M5 7h4M7 5v4"/></svg><span>Збільшити</span></button></div><div class="rbl">Масштаб</div></div>
<div class="rbg edit" data-rt="view"><div class="rbc"><button type="button" class="rb" id="snap"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 5h12M2 11h12M5 2v12M11 2v12"/></svg><span>Прив’язка до сітки</span></button></div><div class="rbl">Сітка</div></div>
<div class="rbg edit" data-rt="view"><div class="rbc"><button type="button" class="rb" id="bgup"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="12" height="10" rx="1.5"/><circle cx="6" cy="6.5" r="1.2"/><path d="M14 11l-4-4-6 6"/></svg><span>Свій план (фото)</span></button><button type="button" class="rb" id="bgmove"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 1v14M1 8h14M8 1L6 3M8 1l2 2M8 15l-2-2M8 15l2-2M1 8l2-2M1 8l2 2M15 8l-2-2M15 8l-2 2"/></svg><span>Рухати фон</span></button><button type="button" class="rb" id="bgdef"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg><span>Прибрати фото</span></button><label class="rng">Прозорість<input id="bgop" type="range" min="0.2" max="1" step="0.05" value="0.9"></label><input type="file" id="bgfile" accept="image/*" hidden></div><div class="rbl">Фон</div></div>
<div class="rbg edit" data-rt="view"><div class="rbc"><label class="rng" title="Скільки пікселів плану в 1 метрі — для радіусів бризок і аерозолю">1 м =<input id="pxm" type="number" min="5" max="400" step="1" value="50" style="width:58px"> px</label><button type="button" class="rb" id="calb" title="Клікніть дві точки на плані і введіть відстань у метрах"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2 12L12 2l2 2L4 14z"/><path d="M5 9l1.5 1.5M7 7l1 1M9 5l1.5 1.5"/></svg><span>Виміряти відрізок</span></button></div><div class="rbl">Масштаб плану</div></div>
<div class="rbg" data-rt="view"><div class="rbc"><button type="button" class="rb" id="mobt" aria-pressed="false" title="Показати інтерфейс у розмірі телефона (390×844)"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="4" y="1.5" width="8" height="13" rx="1.5"/><path d="M7 12.5h2"/></svg><span>Мобільний вигляд</span></button></div><div class="rbl">Екран</div></div>
<div class="rbg edit" data-rt="file"><div class="rbc"><button type="button" class="rb" id="fsave"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 2h8l2 2v9a1 1 0 01-1 1H4a1 1 0 01-1-1z"/><path d="M5 2v4h5V2M5 14v-4h6v4"/></svg><span>Зберегти файлом</span></button><button type="button" class="rb" id="fopen"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4.5V12a1 1 0 001 1h10a1 1 0 001-1V6a1 1 0 00-1-1H8L6.5 3H3a1 1 0 00-1 1.5z"/></svg><span>Відкрити файл</span></button><input type="file" id="ffile" accept=".json,application/json" hidden></div><div class="rbl">Файл плану</div></div>
<div class="rbg" data-rt="file"><div class="rbc"><button type="button" class="rb" id="dzlb" title="Засоби, продавці, ціна робочого розчину"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M6 1.5h4M6.5 1.5v3L3.5 13a1 1 0 00.9 1.5h7.2a1 1 0 00.9-1.5l-3-8.5v-3"/><path d="M4.8 10h6.4"/></svg><span>Засоби і ціни</span></button><button type="button" class="rb edit" id="dzib" title="Вставити таблицю з Excel / Google Таблиць або CSV / XLSX"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><rect x="1.5" y="2.5" width="13" height="11" rx="1"/><path d="M1.5 6h13M6 6v7.5M8 1v6M6.2 5.2L8 7l1.8-1.8"/></svg><span>Імпорт таблиці</span></button></div><div class="rbl">Дезінфектанти</div></div>
<div class="rbg edit" data-rt="file"><div class="rbc"><button type="button" class="rb" id="cp"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="5" width="9" height="9" rx="1.5"/><path d="M3 11V3a1 1 0 011-1h7"/></svg><span>Копіювати JSON</span></button><button type="button" class="rb" id="ld"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="10" height="11" rx="1.5"/><path d="M6 3V2h4v1"/></svg><span>Застосувати JSON</span></button><textarea id="io" title="JSON плану без фото — для надсилання"></textarea></div><div class="rbl">Для розробника</div></div>
<div class="rbg edit" data-rt="file"><div class="rbc"><button type="button" class="rb" id="copyprod" hidden><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 12h7a3 3 0 00.3-6A4 4 0 004 7a2.5 2.5 0 00.5 5z"/></svg><span>З проду в препрод</span></button><button type="button" class="rb" id="rs"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13h10M5 10l6-6 2 2-6 6H5z"/></svg><span>Очистити все</span></button></div><div class="rbl">Дані</div></div>
</div>
</div>
<div class="work"><div class="left">
<div class="wrap" id="wrap"><svg id="cv" viewBox="0 0 1260 1280" role="img" aria-label="План приміщень із шарами, елементи можна перетягувати"></svg></div>
</div>
<aside class="tree" aria-label="Об’єкти плану"><div class="panel off edit" id="panel">
<input type="text" id="lbl" placeholder="Оберіть елемент на плані" disabled>
<select id="typ" disabled><option value="room">Кімната</option><option value="part">Перегородка</option><option value="eq">Обладнання</option><option value="cage">Клітка</option><option value="sink">Раковина</option><option value="water">Вода</option><option value="door">Двері</option><option value="stair">Сходи</option><option value="note">Напис</option></select>
<select id="knd" disabled hidden></select>
<select id="oti" disabled hidden title="Тип об’єкта для правил дезінфекції"></select>
<label id="qtyl" class="qtyl" hidden>Місць<input type="number" id="qty" min="1" max="99" value="1"></label>
<button id="rot" disabled>Повернути 90°</button>
<button id="dup" disabled>Копія</button>
<button id="del" disabled>Видалити</button>
<textarea id="note" placeholder="Нотатка: що тут відбувається, що зробити, текст інструкції" disabled hidden></textarea>
</div>
<div class="ts"><input id="tq" type="search" placeholder="Пошук"></div><div id="tnodes"></div><div id="pass" hidden></div></aside>
</div>
<section id="result"></section>
<div id="ztm" class="ztm" hidden></div>
<footer class="sbar"><span id="sbmode"></span><span id="sbsel"></span><span id="sbhint" class="sbh"></span><span class="sp"></span><span id="sbzoom"></span></footer>

<script src="js/03-geometry.js"></script>

<script src="js/06-panels.js"></script>
<script src="js/07-passport.js"></script>
<script src="js/08-catalog.js"></script>
<script src="js/09-editor.js"></script>
<script src="js/10-menus.js"></script>
<script src="js/11-mobile.js"></script>
<script src="js/12-db.js"></script>
<script src="js/13-disinfectants.js"></script>
